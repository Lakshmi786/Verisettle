name: custodian

networks:
  custodian-net:
    external: true
    name: custodian-net

volumes:
  keycloak-data:
  spire-server-data:
  spire-agent-data:
  spire-agent-sockets:
  infisical-redis-data:

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    container_name: custodian-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${PGPASS_KEYCLOAK}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: "xforwarded"
    volumes:
      - ../keycloak/realm-custodian.json:/opt/keycloak/data/import/realm-custodian.json:ro
      - keycloak-data:/opt/keycloak/data/h2
    ports:
      - "127.0.0.1:8180:8080"
      - "127.0.0.1:9090:9000"
    networks:
      - custodian-net
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1024M

  spire-server-data-init:
    image: alpine:3.22
    container_name: custodian-spire-server-data-init
    command: ["chown", "-R", "1000:1000", "/run/spire/data"]
    volumes:
      - spire-server-data:/run/spire/data
    networks:
      - custodian-net
    restart: "no"

  spire-server:
    image: ghcr.io/spiffe/spire-server:1.15.2
    container_name: custodian-spire-server
    restart: unless-stopped
    command: ["-config", "/run/spire/config/server.conf"]
    depends_on:
      spire-server-data-init:
        condition: service_completed_successfully
    volumes:
      - ../spire/server.conf:/run/spire/config/server.conf:ro
      - spire-server-data:/run/spire/data
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - custodian-net
    healthcheck:
      test: ["CMD", "/opt/spire/bin/spire-server", "healthcheck", "-socketPath", "/run/spire/data/api.sock"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  spire-agent-data-init:
    image: alpine:3.22
    container_name: custodian-spire-agent-data-init
    command: ["sh", "-c", "chown -R 1000:1000 /run/spire/data /run/spire/sockets"]
    volumes:
      - spire-agent-data:/run/spire/data
      - spire-agent-sockets:/run/spire/sockets
    networks:
      - custodian-net
    restart: "no"

  spire-agent:
    image: ghcr.io/spiffe/spire-agent:1.15.2
    container_name: custodian-spire-agent
    restart: unless-stopped
    pid: host
    command: ["-config", "/run/spire/config/agent.conf", "-expandEnv"]
    depends_on:
      spire-server:
        condition: service_healthy
      spire-agent-data-init:
        condition: service_completed_successfully
    environment:
      SPIRE_AGENT_JOIN_TOKEN: ${SPIRE_AGENT_JOIN_TOKEN:-}
    volumes:
      - ../spire/agent.conf:/run/spire/config/agent.conf:ro
      - spire-agent-data:/run/spire/data
      - spire-agent-sockets:/run/spire/sockets
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - custodian-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  infisical-redis:
    image: redis:8.2-alpine
    container_name: custodian-infisical-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - infisical-redis-data:/data
    networks:
      - custodian-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  infisical:
    image: infisical/infisical:v0.162.18
    container_name: custodian-infisical
    restart: unless-stopped
    depends_on:
      infisical-redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET}
      DB_CONNECTION_URI: postgresql://infisical:${PGPASS_INFISICAL}@postgres:5432/infisical
      REDIS_URL: redis://infisical-redis:6379
      SITE_URL: http://localhost:8443
    ports:
      - "127.0.0.1:8443:8080"
    networks:
      - custodian-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/status"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
