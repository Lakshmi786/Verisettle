name: custodian

networks:
  custodian-net:
    external: true
    name: custodian-net

services:
  audit-log:
    build: ../../custodian-audit-log
    container_name: custodian-audit-log
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      PGPASS_CUSTODIAN_BACKEND: ${PGPASS_CUSTODIAN_BACKEND}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:8094:8000"
    networks:
      - custodian-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  control-plane:
    build: ../../custodian-control-plane
    container_name: custodian-control-plane
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      PGPASS_CUSTODIAN_BACKEND: ${PGPASS_CUSTODIAN_BACKEND}
      AUDIT_LOG_URL: http://audit-log:8000
    depends_on:
      audit-log:
        condition: service_healthy
    ports:
      - "127.0.0.1:8095:8000"
    networks:
      - custodian-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  custodian-ledger:
    build: ../../custodian-ledger
    container_name: custodian-ledger
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      PGPASS_CUSTODIAN_LEDGER: ${PGPASS_CUSTODIAN_LEDGER}
      LEDGER_API_KEY: ${LEDGER_API_KEY}
      VENDOR_LOOKUP_API_KEY: ${VENDOR_LOOKUP_API_KEY}
      AUDIT_LOG_URL: http://audit-log:8000
    depends_on:
      audit-log:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8000"
    networks:
      - custodian-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  policy-service:
    build: ../policy-service
    container_name: custodian-policy-service
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      PGPASS_CUSTODIAN_BACKEND: ${PGPASS_CUSTODIAN_BACKEND}
      POLICIES_DIR: /policies
      CONTROL_PLANE_URL: http://control-plane:8000
      AUDIT_LOG_URL: http://audit-log:8000
    volumes:
      - ../../policies:/policies:ro
    depends_on:
      audit-log:
        condition: service_healthy
      control-plane:
        condition: service_healthy
    ports:
      - "127.0.0.1:8091:8000"
    networks:
      - custodian-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M

  # Infisical Agent Proxy's request-forwarding never worked on this
  # self-hosted version (see custodian-backend/app/ledger_client.py) -
  # Payment-Execution instead fetches its ledger credential directly via
  # Infisical's Universal Auth, fresh before each call.

  custodian-backend:
    build: ../../custodian-backend
    container_name: custodian-backend
    restart: unless-stopped
    labels:
      # Matches the SPIRE registration entry in register-spire-entries.sh -
      # this is the one real identity actually issued and used by this
      # process (see app/identity.py). The other 4 per-agent SPIRE entries
      # can't be issued to this process: SPIRE attests one identity per
      # workload, and all 4 agents run as function calls inside this same
      # process, not as 4 separate workloads.
      custodian.service: backend
    environment:
      SPIFFE_ENDPOINT_SOCKET: unix:///run/spire/sockets/agent.sock
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      PGPASS_CUSTODIAN_BACKEND: ${PGPASS_CUSTODIAN_BACKEND}
      LITELLM_URL: http://litellm:4000
      MLFLOW_TRACKING_URI: http://mlflow:5000
      LITELLM_KEY_AGENT_EXTRACTION: ${LITELLM_KEY_AGENT_EXTRACTION}
      LITELLM_KEY_AGENT_RISK_SCORING: ${LITELLM_KEY_AGENT_RISK_SCORING}
      LITELLM_KEY_AGENT_APPROVAL: ${LITELLM_KEY_AGENT_APPROVAL}
      LITELLM_KEY_AGENT_PAYMENT_EXECUTION: ${LITELLM_KEY_AGENT_PAYMENT_EXECUTION}
      POLICY_SERVICE_URL: http://policy-service:8000
      LEDGER_URL: http://custodian-ledger:8000
      VENDOR_LOOKUP_API_KEY: ${VENDOR_LOOKUP_API_KEY}
      CONTROL_PLANE_URL: http://control-plane:8000
      SETTLEMENT_HOLD_SECONDS: ${SETTLEMENT_HOLD_SECONDS:-20}
      LANGFUSE_URL: http://langfuse-web:3000
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY}
      PRESIDIO_ANALYZER_URL: http://presidio-analyzer:3000
      PRESIDIO_ANONYMIZER_URL: http://presidio-anonymizer:3000
      INFISICAL_URL: http://infisical:8080
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID}
      PAYMENT_EXECUTION_CLIENT_ID: ${PAYMENT_EXECUTION_CLIENT_ID}
      PAYMENT_EXECUTION_CLIENT_SECRET: ${PAYMENT_EXECUTION_CLIENT_SECRET}
      SANDBOX_RUNNER_URL: http://sandbox-runner:8000
    volumes:
      # Read-write here (sandbox-runner mounts the same volume read-only) so
      # a console-uploaded invoice image can be written where the sandboxed
      # OCR container can then read it via its own read-only mount.
      - invoice-images:/data/invoices
      - spire-agent-sockets:/run/spire/sockets:ro
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - custodian-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1024M

  sandbox-runner:
    build: ../../custodian-sandbox-runner
    container_name: custodian-sandbox-runner
    restart: unless-stopped
    environment:
      POLICY_SERVICE_URL: http://policy-service:8000
      SANDBOX_IMAGE: custodian-sandbox-ocr:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - invoice-images:/data/invoices:ro
    ports:
      - "127.0.0.1:8093:8000"
    networks:
      - custodian-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M

  custodian-console:
    build: ../../custodian-console
    container_name: custodian-console
    restart: unless-stopped
    environment:
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${CONSOLE_NEXTAUTH_SECRET}
      KEYCLOAK_CLIENT_ID: custodian-console
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CONSOLE_CLIENT_SECRET}
      # Browser reaches Keycloak at localhost:8180; this server at keycloak:8080.
      KEYCLOAK_PUBLIC_URL: http://localhost:8180
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      BACKEND_URL: http://custodian-backend:8000
      LEDGER_URL: http://custodian-ledger:8000
      LEDGER_API_KEY: ${LEDGER_API_KEY}
      AUDIT_LOG_URL: http://audit-log:8000
      CONTROL_PLANE_URL: http://control-plane:8000
      PROMETHEUS_URL: http://prometheus:9090
      POLICIES_DIR: /repo/policies
    volumes:
      - ../../policies:/repo/policies:ro
      - ../../.git:/repo/.git:ro
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - custodian-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://127.0.0.1:3000/api/auth/session"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  # Declared the same (plain, non-external) way in docker-compose.data.yml,
  # which is what actually creates and fills it - `external: true` here
  # would require it to pre-exist, which breaks the very first data-loader
  # run when both files are combined (as infra/scripts/compose.sh always
  # does): Compose merges the two declarations and the external:true one
  # wins, regardless of file order. Declaring it identically in both lets
  # Compose treat it as the same shared volume either way, no ordering
  # dependency.
  invoice-images:
    name: custodian_invoice-images
