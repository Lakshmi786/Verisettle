name: custodian

networks:
  custodian-net:
    external: true
    name: custodian-net

volumes:
  litellm-redis-data:

services:
  litellm-redis:
    image: redis:8.2-alpine
    container_name: custodian-litellm-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - litellm-redis-data:/data
    networks:
      - custodian-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  litellm:
    image: ghcr.io/berriai/litellm-database:v1.95.0
    container_name: custodian-litellm
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      DATABASE_URL: postgresql://litellm:${PGPASS_LITELLM}@postgres:5432/litellm
      REDIS_HOST: litellm-redis
      REDIS_PORT: "6379"
    volumes:
      - ../litellm/config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      litellm-redis:
        condition: service_healthy
    networks:
      - custodian-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:4000/health/liveliness')"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M

  mlflow:
    build: ../mlflow
    container_name: custodian-mlflow
    restart: unless-stopped
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    command:
      - "mlflow"
      - "server"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "5000"
      - "--backend-store-uri"
      - "postgresql://mlflow:${PGPASS_MLFLOW}@postgres:5432/mlflow"
      - "--artifacts-destination"
      - "s3://mlflow-artifacts"
      - "--serve-artifacts"
      # MLflow's DNS-rebinding protection rejects unlisted Host headers by
      # default - needs both the docker-network hostname and the published
      # host port (5500), a different Host header than the in-container port.
      - "--allowed-hosts"
      - "mlflow,mlflow:5000,localhost,localhost:5000,localhost:5500,127.0.0.1,127.0.0.1:5000,127.0.0.1:5500"
      # Default worker count scales with CPU count and OOMs a single-user instance.
      - "--workers"
      - "2"
    ports:
      - "127.0.0.1:5500:5000"
    networks:
      - custodian-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M

  deepeval-gate:
    build: ../deepeval
    container_name: custodian-deepeval-gate
    restart: "no"
    # One-shot job (Step 4) that makes real, paid LLM calls - excluded from
    # a bare `compose.sh up -d` (Step 6) so it isn't silently and needlessly
    # re-run and re-billed; still starts fine via `compose.sh up
    # deepeval-gate` since explicitly naming a service overrides its profile.
    profiles: ["jobs"]
    environment:
      LITELLM_URL: http://litellm:4000
      LITELLM_KEY: ${LITELLM_EXTRACTION_KEY:-${LITELLM_MASTER_KEY}}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      PGPASS_CUSTODIAN_BACKEND: ${PGPASS_CUSTODIAN_BACKEND}
      PROMOTION_THRESHOLD: "0.6"
    networks:
      - custodian-net
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
