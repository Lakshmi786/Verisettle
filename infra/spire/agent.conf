agent {
  data_dir = "/run/spire/data"
  socket_path = "/run/spire/sockets/agent.sock"
  log_level = "INFO"
  server_address = "spire-server"
  server_port = "8081"
  trust_domain = "verisettle.local"
  join_token = "${SPIRE_AGENT_JOIN_TOKEN}"
  # Local-dev simplification: no out-of-band trust bundle distribution
  # channel exists in this single-host setup, so the agent trusts the
  # server's cert on first contact. The join token (single-use, generated
  # per bootstrap) is the actual authentication boundary for that first
  # connection. Real production SPIRE deploys ship a trust_bundle_path/
  # trust_bundle_url instead.
  insecure_bootstrap = true
}

plugins {
  NodeAttestor "join_token" {
    plugin_data {}
  }

  KeyManager "disk" {
    plugin_data {
      directory = "/run/spire/data"
    }
  }

  WorkloadAttestor "docker" {
    plugin_data {
      docker_socket_path = "unix:///var/run/docker.sock"
    }
  }

  WorkloadAttestor "unix" {
    plugin_data {}
  }
}
